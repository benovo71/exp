<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Генератор актов</title>
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <h1>📄 Генерация документов</h1>

    <form class="form" id="reportForm">
      <label for="userName">👤 Пользователь</label>
      <input type="text" id="userName" placeholder="Иванов И.И." required />

      <label for="pgNumber">🔢 PG номер</label>
      <input type="text" id="pgNumber" placeholder="PG1047176" required />

      <label for="issuedBy">✍️ Кто выдал</label>
      <input type="text" id="issuedBy" placeholder="Петров П.П." required />

      <label for="performedBy">🔧 Кто осуществил</label>
      <input type="text" id="performedBy" placeholder="Сидоров С.С." required />
    </form>

    <button id="generateBtn">🚀 Сгенерировать</button>
    <div id="status"></div>
    <div id="log" class="log"></div>

    <!-- 🔹 type="module" для import/export -->
    <script type="module" src="renderer.js"></script>
  </body>
</html>
