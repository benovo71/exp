<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Генератор актов</title>
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <h1>📄 Генерация документов</h1>

    <form class="form" id="reportForm">
      <label for="userName">👤 Пользователь</label>
      <input type="text" id="userName" placeholder="Иванов И.И." required />

      <label class="checkbox-field" for="adviros">
        <input type="checkbox" id="adviros" />
        Adviros
      </label>

      <label class="checkbox-field" for="surrender">
        <input type="checkbox" id="surrender" />
        Сдача компа
      </label>

      <label class="checkbox-field" for="ownerChange">
        <input type="checkbox" id="ownerChange" />
        Смена владельца
      </label>

      <label class="issue-only-field" for="intranetName">👤 PG name</label>
      <input class="issue-only-field" type="text" id="intranetName" placeholder="gorshkov.i" required />

      <label class="issue-only-field" for="ticket">RITM / INC</label>
      <input class="issue-only-field" type="text" id="ticket" placeholder="RITM8463161" required />

      <label class="pg-search-field" for="pgNumber">🔢 PG номер</label>
      <input class="pg-search-field" type="text" id="pgNumber" placeholder="PG1047176" required />

      <label class="owner-change-field" for="tNumber" hidden>🔢 T number владельца</label>
      <input class="owner-change-field" type="text" id="tNumber" placeholder="CY8088" hidden />

      <label class="owner-change-field" for="newOwner" hidden>👤 Новый владелец</label>
      <input class="owner-change-field" type="text" id="newOwner" placeholder="Иванов Иван" hidden />

      <label for="issuedBy">✍️ Кто выдал</label>
      <input type="text" id="issuedBy" placeholder="Петров П.П." required />

      <label for="performedBy">🔧 Кто осуществил</label>
      <input type="text" id="performedBy" placeholder="Сидоров С.С." required />

      <button type="submit" id="generateBtn">🚀 Сгенерировать</button>
    </form>
    <div id="status" aria-live="polite"></div>
    <div id="log" class="log"></div>

    <script type="module" src="renderer.js"></script>
  </body>
</html>
